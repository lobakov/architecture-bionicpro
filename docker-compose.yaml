version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: crm-postgres
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=1", "-c", "max_wal_senders=1"]
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crmpassword
      POSTGRES_DB: crm
    ports:
      - "5432:5432"
    volumes:
      - ./init/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bionicpro-network

  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    environment:
      LDAP_ORGANISATION: "BionicPRO"
      LDAP_DOMAIN: "example.com"
      LDAP_ADMIN_PASSWORD: "adminpassword"
      LDAP_TLS: "false"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ./source/ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/bootstrap.ldif
    command: --copy-service
    networks:
      - bionicpro-network

  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./Task1/subtask6/keycloak-results-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      - openldap
    networks:
      - bionicpro-network

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - bionicpro-network

  bionicpro-auth:
    build: ./Task1/subtask3/bionicpro-auth
    container_name: bionicpro-auth
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: reports-realm
      KEYCLOAK_CLIENT_ID: reports-frontend
      REDIRECT_URI: http://localhost:8000/auth/callback
      REDIS_HOST: redis
      REDIS_PORT: 6379
      APP_ENCRYPTION_KEY: "your-fernet-key"
      SESSION_TTL_SECONDS: 2592000
      API_SERVICE_URL: http://reports-api:8001
      SERVER_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - keycloak
      - redis
      - reports-api
    networks:
      - bionicpro-network

  reports-api:
    build: ./Task4/reports-api
    container_name: reports-api
    environment:
      SERVER_PORT: 8001
      SPRING_DATASOURCE_URL: jdbc:clickhouse://clickhouse:8123/reports?compress=0
      SPRING_DATASOURCE_USERNAME: default
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.clickhouse.jdbc.ClickHouseDriver
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8080/realms/reports-realm
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: reports
      MINIO_CDN_BASE_URL: http://localhost:8081
    ports:
      - "8001:8001"
    depends_on:
      - clickhouse
      - minio
      - keycloak
    networks:
      - bionicpro-network

  frontend:
    build: ./Task2/subtask5/frontend
    container_name: frontend
    environment:
      REACT_APP_API_URL: http://bionicpro-auth:8000
      REACT_APP_AUTH_URL: http://bionicpro-auth:8000/auth
    ports:
      - "3000:3000"
    depends_on:
      - bionicpro-auth
    networks:
      - bionicpro-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - bionicpro-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - bionicpro-network

  connect:
    image: debezium/connect:2.5
    container_name: debezium-connect
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
    networks:
      - bionicpro-network

  debezium-connector-init:
    image: curlimages/curl:latest
    container_name: debezium-connector-init
    depends_on:
      - connect
    entrypoint: >
      sh -c "
        echo 'Waiting for Kafka Connect...';
        until curl -f -s http://connect:8083/connectors > /dev/null 2>&1; do
          sleep 5;
        done;
        echo 'Kafka Connect is ready, creating connector...';
        curl -X POST http://connect:8083/connectors -H 'Content-Type: application/json' --data-binary @/connector-config/crm-connector.json;
        echo 'Connector creation attempted.'
      "
    volumes:
      - ./Task4/debezium.json:/connector-config/crm-connector.json
    networks:
      - bionicpro-network

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse
    environment:
      CLICKHOUSE_DB: reports
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    ports:
      - "8123:8123"
      - "9100:9000"
    volumes:
      - ./init/clickhouse:/docker-entrypoint-initdb.d
    depends_on:
      - kafka
    networks:
      - bionicpro-network

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - bionicpro-network

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      sh -c "
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo 'Waiting for MinIO...';
          sleep 5;
        done;
        mc mb local/reports || true;
        echo 'Bucket ready';
      "
    networks:
      - bionicpro-network

  nginx:
    image: nginx:latest
    container_name: cdn-nginx
    ports:
      - "8081:80"
    volumes:
      - ./Task3/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - minio
    networks:
      - bionicpro-network

volumes:
  minio_data:
  nginx_cache:

networks:
  bionicpro-network:
    driver: bridge
